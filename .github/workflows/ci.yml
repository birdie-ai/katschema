name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  grammar-validation:
    name: Validate Ohm Grammar Examples
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: 'grammar/package.json'
          cache-dependency-path: 'grammar/package-lock.json'
          cache: npm

      - name: Install validator dependencies
        run: cd grammar && npm ci

      - name: Check examples using grammar.
        run: make check/grammar
