name: benchmark comment

on:
  workflow_run:
    workflows:
      - benchmarks
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Comment on pull request
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Download benchmark report
        uses: actions/download-artifact@v8
        with:
          name: benchmark-result
          path: ${{ runner.temp }}/benchmark-result
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update benchmark comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: benchcheck-result
          number_force: ${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/benchmark-result/output.txt
